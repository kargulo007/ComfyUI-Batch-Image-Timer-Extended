[project]
name = "comfyui-batch-image-timer-extended"
version = "1.9.2"
authors = [{name = "Piotr Karwowski"}]
maintainers = [{name = "Piotr Karwowski"}]
description = "ComfyUI generation timer with history, analytics, GPU/VRAM monitoring and persistent SQLite statistics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp"]
license = {file = "LICENSE"}
keywords = ["comfyui", "timer", "generation", "gpu", "vram", "sqlite", "analytics"]

